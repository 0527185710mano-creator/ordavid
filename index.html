<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>שילוט דיגיטלי - אור דוד</title>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;800&family=Varela+Round&display=swap" rel="stylesheet">

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.92);
            --thick-border: 4px solid #70593e; /* מסגרת עבה ובולטת בגוון זהב-אדמה עשיר */
            --center-border: 5px solid #70593e; /* מסגרת עבה עוד יותר למרכז */
            --box-shadow-bold: 0 12px 35px rgba(0, 0, 0, 0.3), 0 0 15px rgba(112, 89, 62, 0.3); /* הצללה חזקה שתבליט את הריבועים */
            --text-dark: #2d3748;
            --accent-gold: #8b7355;
            --accent-glow: rgba(139, 115, 85, 0.1);
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100dvw;
            height: 100dvh;
            overflow: hidden;
            background-color: #000;
        }

        /* 🔒 מסך נעילה עצמאי לחלוטין */
        .view-lock-screen {
            position: fixed !important; 
            top: 0 !important; 
            left: 0 !important; 
            width: 100dvw !important; 
            height: 100dvh !important;
            background: radial-gradient(circle, #1e1e30 0%, #0f0f1a 100%) !important; 
            display: flex !important;
            flex-direction: column !important; 
            justify-content: center !important; 
            align-items: center !important; 
            z-index: 999999999 !important;
            font-family: 'Varela Round', sans-serif !important; 
            color: white !important; 
            direction: rtl !important; 
            box-sizing: border-box !important;
        }

        .view-lock-box {
            background: rgba(30, 30, 48, 0.75) !important; 
            backdrop-filter: blur(20px) !important; 
            -webkit-backdrop-filter: blur(20px) !important;
            padding: 25px !important; 
            border-radius: 20px !important; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5) !important;
            text-align: center !important; 
            max-width: 360px !important; 
            width: 85% !important; 
            border: 3px solid rgba(255,255,255,0.4) !important; 
            box-sizing: border-box !important;
        }
        .view-lock-box h2 { font-size: 1.6rem !important; color: #ffffff !important; margin: 0 0 8px 0 !important; font-weight: 800 !important; }
        .view-lock-box p { color: #a0aec0 !important; font-size: 0.95rem !important; margin: 0 0 15px 0 !important; }
        .view-lock-box input { width: 100% !important; padding: 12px !important; border: 2px solid #4a5568 !important; background: rgba(255,255,255,0.05) !important; color: white !important; border-radius: 10px !important; text-align: center !important; font-size: 1.3rem !important; box-sizing: border-box !important; outline: none !important; margin-bottom: 12px !important; }
        .view-lock-box button { width: 100% !important; padding: 12px !important; background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%) !important; color: white !important; border: none !important; border-radius: 10px !important; font-size: 1.1rem !important; font-weight: bold !important; cursor: pointer !important; }

        /* קונטיינר ראשי של השילוט */
        #app-container {
            width: 100dvw;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: url('masah.png') no-repeat center center;
            background-size: 100% 100%;
            color: var(--text-dark);
            font-family: 'Assistant', sans-serif;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            padding: 1.5vh 1.5vw 0 1.5vw;
        }

        /* 🔄 אילוץ סיבוב מיידי לרוחב ב-CSS */
        @media (orientation: portrait) {
            .view-lock-screen {
                width: 100dvh !important;
                height: 100dvw !important;
                top: 50% !important;
                left: 50% !important;
                transform: translate(-50%, -50%) rotate(-90deg) !important;
                transform-origin: center center !important;
            }
            
            #app-container {
                width: 100dvh !important;
                height: 100dvw !important;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) rotate(-90deg);
                transform-origin: center center;
            }
            
            .main-layout { gap: 1.5vw !important; padding: 0 !important; grid-template-columns: 25% 46% 25% !important; }
            .hebrew-date-container { padding: 6px !important; border-radius: 16px !important; gap: 0.2vh !important; }
            .hebrew-date-header { font-size: clamp(10px, 1.1vw, 18px) !important; }
            .live-time-display { font-size: clamp(12px, 1.6vw, 22px) !important; }
            .shabbat-info-text { font-size: clamp(8px, 0.9vw, 13px) !important; }
            
            .sub-box-fixed { font-size: clamp(11px, 1.8vw, 22px) !important; height: 18% !important; padding: 1vh 1vw !important; }
            .scroll-right-content, .scroll-left-content { font-size: clamp(11px, 1.8vw, 22px) !important; }
            .ticker { font-size: clamp(14px, 2.8vw, 32px) !important; }
            
            .view-lock-box { max-width: 320px !important; padding: 20px !important; }
            .view-lock-box h2 { font-size: 1.4rem !important; }
            .view-lock-box p { font-size: 0.9rem !important; }
            .view-lock-box input { font-size: 1.1rem !important; padding: 10px !important; }
            .view-lock-box button { padding: 11px !important; font-size: 1rem !important; }
        }

        /* תיבת השעון - משולבת בצורה זורמת בצד שמאל */
        .hebrew-date-container {
            width: 100%; 
            text-align: center; 
            direction: rtl;
            display: flex; 
            flex-direction: column; 
            gap: 0.2vh; 
            background: rgba(255, 255, 255, 0.94); 
            border: var(--thick-border);
            border-radius: 16px; 
            padding: 6px 8px; 
            box-shadow: var(--box-shadow-bold);
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .hebrew-date-header { font-family:'Varela Round', sans-serif; font-size: clamp(11px, 1.3vw, 20px); font-weight: 700; color:#000000; }
        .live-time-display { font-family: 'Varela Round', sans-serif; font-size: clamp(12px, 1.4vw, 22px); font-weight: 800; color: var(--accent-gold); font-variant-numeric: tabular-nums; }
        
        .shabbat-divider { height: 2px; background: #70593e; width: 85%; margin: 2px auto; border-radius: 2px; }
        .shabbat-info-text { font-family: 'Assistant', sans-serif; font-size: clamp(9px, 0.85vw, 13px); font-weight: 600; color: #2d3748; line-height: 1.2; }
        .shabbat-info-text strong { color: var(--accent-gold); }

        /* הגדרת גריד מיושר: עמודה ימנית (25%), מרכז (46%), עמודה שמאלית (25%) */
        .main-layout { 
            display: grid; 
            grid-template-columns: 25% 46% 25%; 
            flex: 1;
            min-height: 0;
            box-sizing: border-box; 
            padding: 0 1.5vw; 
            margin-top: 15vh; 
            margin-bottom: 1.5vh;
            gap: 2vw; 
        }
        .column-container { display: flex; flex-direction: column; height: 100%; min-height: 0; gap: 1.5vh; width: 100%; }

        /* תיבות גלילה עם מסגרת עבה וסגורה מכל הצדדים */
        .sub-box-scroll {
            flex: 1; 
            min-height: 0;
            background: var(--glass-bg); 
            border: var(--thick-border);
            border-radius: 22px;
            position: relative; 
            overflow: hidden; 
            box-sizing: border-box; 
            padding: 2vh 1.2vw;
            box-shadow: var(--box-shadow-bold);
        }

        .sub-box-fixed {
            height: 18vh; 
            min-height: 45px;
            background: rgba(255, 249, 241, 0.96); 
            border: var(--thick-border);
            border-radius: 22px; 
            box-sizing: border-box; 
            padding: 1vh 1vw; 
            display: flex; 
            justify-content: center;
            align-items: center; 
            text-align: center; 
            font-family: 'Varela Round', sans-serif; 
            font-size: clamp(11px, 1.4vw, 22px);
            color: #70593e; 
            font-weight: 700; 
            box-shadow: var(--box-shadow-bold); 
            overflow: hidden; 
            border-bottom: 6px solid #70593e;
            flex-shrink: 0;
        }

        .scroll-right-content, .scroll-left-content { position: absolute; width: 100%; text-align: center; white-space: pre-line; font-size: clamp(11px, 1.4vw, 22px); font-weight: 600; color: #7a004b; transform: translate3d(0, 0, 0); backface-visibility: hidden; perspective: 1000px; will-change: transform; }
        .scroll-right-content { animation: scrollUpRight 28s linear infinite; }
        .scroll-left-content { animation: scrollUpLeft 24s linear infinite; }

        @keyframes scrollUpRight { 0% { transform: translate3d(0, 45vh, 0); opacity: 0; } 5% { opacity: 1; } 95% { opacity: 1; } 100% { transform: translate3d(0, -105%, 0); opacity: 0; } }
        @keyframes scrollUpLeft { 0% { transform: translate3d(0, 45vh, 0); opacity: 0; } 5% { opacity: 1; } 95% { opacity: 1; } 100% { transform: translate3d(0, -105%, 0); opacity: 0; } }

        /* תיבה מרכזית – רקע לבן מלא ואחיד מקצה לקצה */
        .center-column {
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center;
            background: rgba(255, 255, 255, 0.95); 
            border: var(--center-border);
            border-radius: 26px;
            height: 100%; 
            min-height: 0;
            padding: 2vh 2vw; 
            box-sizing: border-box; 
            overflow: hidden; 
            box-shadow: var(--box-shadow-bold); 
            position: relative;
        }
        
        .center-column h1 { 
            font-family: 'Varela Round', sans-serif; 
            margin: 0 0 1.5vh 0; 
            font-weight: 800; 
            color: var(--accent-gold); 
            line-height: 1.2; 
            width: 100%; 
            word-wrap: break-word;
            flex-shrink: 0;
        }

        .center-column-content-wrapper {
            width: 100%;
            flex-grow: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 0 5px;
        }

        .center-column-content-wrapper::-webkit-scrollbar { width: 6px; }
        .center-column-content-wrapper::-webkit-scrollbar-thumb { background: #70593e; border-radius: 10px; }

        .center-column p { 
            font-family: 'Assistant', sans-serif; 
            margin: 0; 
            line-height: 1.35; 
            color: var(--text-dark); 
            font-weight: 500; 
            width: 100%; 
            white-space: pre-line;
            word-wrap: break-word;
        }

        /* תיקון: מתיחת הסרגל התחתון מקצה לקצה על ידי ביטול ה-padding */
        .ticker-wrap { 
            width: calc(100% + 3vw); 
            margin-right: -1.5vw; 
            margin-left: -1.5vw; 
            height: 7vh; 
            min-height: 35px; 
            background: #1e293b; 
            border-top: 4px solid #70593e; 
            box-shadow: 0 -6px 20px rgba(0,0,0,0.5); 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            box-sizing: border-box; 
            position: relative; 
            flex-shrink: 0; 
        }
        .ticker { display: inline-block; white-space: nowrap; position: absolute; left: 0; font-family: 'Varela Round', sans-serif; font-size: clamp(14px, 1.8vw, 28px); font-weight: 800; color: #f6e05e; padding-right: 30px; animation: marqueeLeftToRight 30s linear infinite; transform: translate3d(-100%, 0, 0); backface-visibility: hidden; perspective: 1000px; will-change: transform; }
        @keyframes marqueeLeftToRight { 0% { transform: translate3d(-100%, 0, 0); } 100% { transform: translate3d(100dvw, 0, 0); } }
    </style>
</head>
<body>

<div id="viewLock" class="view-lock-screen">
    <div class="view-lock-box">
        <h2>שילוט דיגיטלי נעול</h2>
        <p>הזן קוד גישה כדי לצפות בשילוט:</p>
        <input type="tel" id="viewPasswordInput" placeholder="הקלד קוד צפייה..." pattern="[0-9]*" inputmode="numeric">
        <button type="button" onclick="handleAccessAttempt()">כניסה למסך</button>
        <p id="viewErrorMsg" style="color: #f56565 !important; margin: 10px 0 0 0 !important; display: none !important; font-size: 0.95rem !important; font-weight: bold !important;">קוד שגוי, נסה שוב!</p>
    </div>
</div>

<div id="app-container">

    <!-- גריד התוכן -->
    <div class="main-layout">
        <!-- עמודה ימנית -->
        <div class="column-container">
            <div class="sub-box-scroll">
                <div style="position: relative; flex-grow: 1; overflow: hidden; height: 100%;">
                    <div class="scroll-right-content" id="displayScrollRight">טוען הודעות ימין...</div>
                </div>
            </div>
            <div class="sub-box-fixed" id="displayFixedRight">טוען הודעה קבועה ימין...</div>
        </div>

        <!-- עמודה מרכזית -->
        <div class="center-column" id="centerBox">
            <h1 id="displayTitle">טוען כותרת...</h1>
            <div class="center-column-content-wrapper" id="centerWrapper">
                <p id="displayMessage">מתחבר לשרת אור דוד</p>
            </div>
        </div>

        <!-- עמודה שמאלית (עם השעון למעלה) -->
        <div class="column-container">
            <!-- שעון, תאריך ופרשת שבוע / זמני שבת -->
            <div class="hebrew-date-container">
                <div class="hebrew-date-header" id="hebrewDateDisplay">טוען תאריך...</div>
                <div class="live-time-display" id="timeDisplay">00:00:00</div>
                
                <div class="shabbat-divider"></div>
                <div class="shabbat-info-text" id="parashaDisplay">ערש"ק פרשת <strong>טוען...</strong></div>
                <div class="shabbat-info-text" id="candlesDisplay">זמן הדלקת נרות: <strong>טוען...</strong></div>
            </div>

            <div class="sub-box-scroll">
                <div style="position: relative; flex-grow: 1; overflow: hidden; height: 100%;">
                    <div class="scroll-left-content" id="displayScrollLeft">טוען הודעות שמאל...</div>
                </div>
            </div>
            <div class="sub-box-fixed" id="displayFixedLeft">טוען הודעה קבועה שמאל...</div>
        </div>
    </div>

    <div class="ticker-wrap" id="tickerContainer">
        <div class="ticker" id="displayTicker">טוען עדכונים רצים...</div>
    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  const VIEW_PASSWORD = "5555";

  async function forceLandscapeAndFullscreen() {
      const docEl = document.documentElement;
      try {
          if (docEl.requestFullscreen) {
              await docEl.requestFullscreen();
          } else if (docEl.webkitRequestFullscreen) {
              await docEl.webkitRequestFullscreen();
          }

          if (screen.orientation && screen.orientation.lock) {
              await screen.orientation.lock('landscape');
          }
      } catch (err) {
          console.log("נעילת כיוון דרך הדפדפן לא נתמכת:", err);
      }
  }

  function handleAccessAttempt() {
      const entered = document.getElementById('viewPasswordInput').value;
      if (entered === VIEW_PASSWORD) {
          forceLandscapeAndFullscreen();
          document.getElementById('viewLock').style.setProperty('display', 'none', 'important');
      } else {
          document.getElementById('viewErrorMsg').style.setProperty('display', 'block', 'important');
      }
  }

  document.getElementById('viewPasswordInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') { handleAccessAttempt(); }
  });

  function fitCenterContent() {
      const titleEl = document.getElementById('displayTitle');
      const msgEl = document.getElementById('displayMessage');
      const wrapperEl = document.getElementById('centerWrapper');
      const centerBox = document.getElementById('centerBox');

      if (!titleEl || !msgEl || !centerBox) return;

      const titleText = titleEl.innerText || "";
      const msgText = msgEl.innerText || "";

      if (titleText.length > 40) {
          titleEl.style.fontSize = '2.2vw';
      } else if (titleText.length > 25) {
          titleEl.style.fontSize = '2.8vw';
      } else {
          titleEl.style.fontSize = '3.5vw';
      }

      const totalChars = msgText.length;
      let fontSizeVW = 2.3;

      if (totalChars > 450) {
          fontSizeVW = 1.1;
      } else if (totalChars > 300) {
          fontSizeVW = 1.35;
      } else if (totalChars > 180) {
          fontSizeVW = 1.6;
      } else if (totalChars > 100) {
          fontSizeVW = 1.9;
      } else {
          fontSizeVW = 2.3;
      }

      msgEl.style.fontSize = fontSizeVW + 'vw';

      let currentSize = fontSizeVW;
      while (wrapperEl.scrollHeight > wrapperEl.clientHeight && currentSize > 0.8) {
          currentSize -= 0.05;
          msgEl.style.fontSize = currentSize + 'vw';
      }
  }

  window.addEventListener('resize', fitCenterContent);

  async function updateShabbatInfo() {
      try {
          const response = await fetch('https://www.hebcal.com/shabbat?cfg=json&geonameid=293148&M=on');
          const data = await response.json();
          
          const parashaItem = data.items.find(item => item.category === 'parashat');
          if (parashaItem) {
              document.getElementById('parashaDisplay').innerHTML = `ערש"ק פרשת <strong>${parashaItem.hebrew}</strong>`;
          }

          const candlesItem = data.items.find(item => item.category === 'candles');
          if (candlesItem) {
              const candleTime = new Date(candlesItem.date).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
              document.getElementById('candlesDisplay').innerHTML = `זמן הדלקת נרות: <strong>${candleTime}</strong>`;
          }
      } catch (e) {
          console.error("שגיאה בטעינת נתוני שבת:", e);
      }
  }

  function numToHebrewLetters(num, isYear = false) {
      if (isYear) num = num % 1000; 
      const hundreds = ["", "ק", "ר", "ש", "ת", "תק", "תר", "תש", "תת", "תתק"];
      const tens = ["", "י", "כ", "ל", "מ", "נ", "ס", "ע", "פ", "צ"];
      const units = ["", "א", "ב", "ג", "ד", "ה", "ו", "ז", "ח", "ט"];
      if (num === 15) return 'ט"ו'; if (num === 16) return 'ט"ז';
      let h = Math.floor(num / 100); let t = Math.floor((num % 100) / 10); let u = num % 10;
      let lastTwo = (num % 100); let result = "";
      if (h > 0 && h < hundreds.length) result += hundreds[h];
      if (lastTwo === 15) result += "טו"; else if (lastTwo === 16) result += "טז"; else result += tens[t] + units[u];
      if (result.length === 1) return result + "'"; else if (result.length > 1) return result.slice(0, -1) + '"' + result.slice(-1);
      return "";
  }

  function updateDateTime() {
      try {
          const now = new Date();
          document.getElementById('timeDisplay').innerText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
          
          const daysOfWeek = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];
          const dayName = "יום " + daysOfWeek[now.getDay()];
          const formatter = new Intl.DateTimeFormat('he-IL-u-ca-hebrew', { day: 'numeric', month: 'long', year: 'numeric' });
          const parts = formatter.formatToParts(now);
          const rawDay = parseInt(parts.find(p => p.type === 'day').value, 10);
          let month = parts.find(p => p.type === 'month').value;
          const rawYear = parseInt(parts.filter(p => p.type === 'year')[0].value, 10);
          const hebrewDay = numToHebrewLetters(rawDay);
          const hebrewYear = "ה" + numToHebrewLetters(rawYear, true);
          if (month.startsWith('ב')) month = month.substring(1);
          month = month.replace(/[׳״']/g, "");
          document.getElementById('hebrewDateDisplay').innerText = `${dayName} ${hebrewDay} ${month} ${hebrewYear}`;

      } catch (e) { console.error(e); }
  }
  
  updateDateTime(); 
  setInterval(updateDateTime, 1000);

  updateShabbatInfo();
  setInterval(updateShabbatInfo, 12 * 60 * 60 * 1000);

  // Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyCNh5bjmUt4aQ86gh9UvDidaTWLSulbIrs",
    authDomain: "ordavid-5e2b0.firebaseapp.com",
    databaseURL: "https://ordavid-5e2b0-default-rtdb.firebaseio.com",
    projectId: "ordavid-5e2b0",
    storageBucket: "ordavid-5e2b0.firebasestorage.app",
    messagingSenderId: "491182630675",
    appId: "1:491182630675:web:d2df61684dfa5eb824dce6"
  };
  firebase.initializeApp(firebaseConfig);
  firebase.database().ref('signage').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
          document.getElementById('displayTitle').innerText = data.title || "אין כותרת זמינה";
          document.getElementById('displayMessage').innerText = data.message || "אין הודעה זמינה";
          document.getElementById('displayScrollRight').innerText = data.scrollRight || "אין הודעות ימין";
          document.getElementById('displayScrollLeft').innerText = data.scrollLeft || "אין הודעות שמאל";
          document.getElementById('displayFixedRight').innerText = data.fixedRight || "לעילוי נשמת";
          document.getElementById('displayFixedLeft').innerText = data.fixedLeft || "הודעה קבועה";
          document.getElementById('displayTicker').innerText = (data.ticker && data.ticker.trim() !== "") ? data.ticker : "אין עדכונים זורמים כרגע";

          if (data.parasha) {
              document.getElementById('parashaDisplay').innerHTML = `ערש"ק פרשת <strong>${data.parasha}</strong>`;
          }
          if (data.candles) {
              document.getElementById('candlesDisplay').innerHTML = `זמן הדלקת נרות: <strong>${data.candles}</strong>`;
          }

          setTimeout(fitCenterContent, 50);
      }
  });
</script>

</body>
</html>
